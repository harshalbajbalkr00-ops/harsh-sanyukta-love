<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harsh ❤️ Sanyukta</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family:Poppins,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.card{
  background:rgba(255,255,255,0.92);
  width:95%;
  max-width:420px;
  padding:25px;
  border-radius:25px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  text-align:center;
}

.hidden{display:none;}

.handwritten{
  font-family:'Pacifico', cursive;
  font-size:18px;
  color:#444;
  line-height:1.6;
  margin:15px 0;
}

button{
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4b7d;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin-top:12px;
  transition:.3s;
}
button:hover{transform:scale(1.08);}

input{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:80%;
  text-align:center;
}

.gallery{
  display:flex;
  overflow-x:auto;
  gap:10px;
  margin:15px 0;
}
.gallery img{
  width:140px;
  height:180px;
  object-fit:cover;
  border-radius:15px;
}

/* Game */
#game{
  margin-top:15px;
  position:relative;
  height:200px;
  background:#fff0f5;
  border-radius:15px;
  overflow:hidden;
}
#heart{
  position:absolute;
  font-size:32px;
  cursor:pointer;
}

/* Popup */
#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5;
}
.popup-card{
  background:white;
  padding:25px;
  border-radius:20px;
  max-width:350px;
  text-align:center;
}

/* HEART RAIN */
.heartRain{
  position:fixed;
  top:-30px;
  font-size:22px;
  color:#ff1744;
  opacity:0;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{transform:translateY(-10vh);opacity:0;}
  10%{opacity:1;}
  100%{transform:translateY(110vh);opacity:0;}
}

/* LOVE LETTER SMOOTH */
#finalLetter{
  animation:letterIn 2s ease forwards;
}
@keyframes letterIn{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card" id="login">
  <h2>Only For Sanyukta ❤️</h2>
  <input type="password" id="pass" placeholder="Enter Secret Password">
  <br>
  <button onclick="checkPass()">Unlock 💌</button>
</div>

<div class="card hidden" id="main">
  <h2>Sanyukta ❤️</h2>

  <div class="handwritten">
    Sona… tu mazya life chi saglyat beautiful feeling ahes ❤️
  </div>

  <div class="gallery">
    <img src="file_00000000f9ac71fa98cdddbc68f15c6e.jpg">
    <img src="file_00000000cdc071fab1262dd3c9e9e206.jpg">
    <img src="file_00000000213871fa994a026c1f65f8a2.jpg">
    <img src="file_0000000016d471faa08a5dd134a49fd2.png">
    <img src="file_00000000135071fa8b5cd839279892a6.jpg">
  </div>

  <button onclick="startGame()">He ghe maz heart, khel hecha shi ❤️</button>

  <div id="game" class="hidden">
    <div id="heart">❤️</div>
  </div>
</div>

<div id="popup">
  <div class="popup-card">
    <h2>Sanyukta…</h2>
    <p class="handwritten">Will you be mine forever?</p>
    <button onclick="sayYes()">Yes 💍</button>
  </div>
</div>

<audio id="music" loop>
  <source src="https://pagalfree.com/musics/128-Raanjhanaa%20Title%20Track-128%20Kbps.mp3" type="audio/mp3">
</audio>

<script>
const PASSWORD="harsh❤️sona1322";

function checkPass(){
  if(pass.value===PASSWORD){
    login.classList.add("hidden");
    main.classList.remove("hidden");
    music.play();
  }else alert("Wrong password 😜");
}

/* GAME */
let score=0,interval;
function startGame(){
  game.classList.remove("hidden");
  score=0;
  moveHeart();
  interval=setInterval(moveHeart,650);
}
function moveHeart(){
  heart.style.left=Math.random()*(game.clientWidth-40)+"px";
  heart.style.top=Math.random()*(game.clientHeight-40)+"px";
}
heart.onclick=()=>{
  score++;
  if(score>=5){
    clearInterval(interval);
    popup.style.display="flex";
  }
};

/* YES FLOW */
function sayYes(){
  popup.style.display="none";
  heavyHeartRain();
  setTimeout(showFinalLetter,5000);
}

/* HEAVY HEART RAIN */
function heavyHeartRain(){
  for(let i=0;i<120;i++){
    let h=document.createElement("div");
    h.className="heartRain";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(16+Math.random()*20)+"px";
    h.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(h);
  }
}

/* FINAL LETTER */
function showFinalLetter(){
  document.body.innerHTML=`
  <div style="height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;">
    <div id="finalLetter" style="background:white;padding:35px;border-radius:25px;max-width:420px;text-align:center;">
      <h2 style="color:#e91e63;">My Forever Letter 💌</h2>
      <p style="font-family:Pacifico,cursive;font-size:18px;line-height:1.6;color:#444;">
      Sanyukta,<br><br>
      Aaj tu “Yes” mhantali ani mazya jagnyala navin meaning milala.<br>
      Mi promise karto, har ek divas tujha haat dharun chalel.<br>
      Tujha hasna mazya sathi motivation asel.<br><br>
      Tu fakta majhi love nahi…<br>
      Tu majhi future ahes.<br><br>
      Forever Yours,<br>
      Harsh ❤️
      </p>
    </div>
  </div>`;
}
</script>

</body>
</html>
